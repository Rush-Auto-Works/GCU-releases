name: Sync manual

# Mirrors GCU release notes into the owner's manual
# (Rush-Auto-Works/manual.rush.sr) so GitHub stays the single source of truth.
# When CHANGELOG.md changes on main it regenerates the manual's firmware page
# "## Releases" section from CHANGELOG.md, copies the newest release's zip into
# the manual's GitBook assets, and opens a PR on the manual repo. The GCU release
# workflow adds a version's entry only after its public release exists, so the
# newest entry always has a zip to copy. A release-published trigger fired
# before that entry landed, and a second run would reset the fixed PR branch.
#
# DISABLED BY DEFAULT. The job is gated on the repo variable
# MANUAL_SYNC_ENABLED == 'true'. Leave it unset until this repo is public and
# the MANUAL_SYNC_TOKEN secret (a token with write access to manual.rush.sr) is
# configured. Until then the job is skipped; the renderer can still be tested
# locally:  python3 scripts/sync_manual.py --check <manual_repo_root>

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: vars.MANUAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out GCU-releases
        uses: actions/checkout@v4

      - name: Check out the manual
        uses: actions/checkout@v4
        with:
          repository: Rush-Auto-Works/manual.rush.sr
          token: ${{ secrets.MANUAL_SYNC_TOKEN }}
          path: manual

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Copy release assets into the manual
        # Pull the newest public release's rush_GCU_*.zip into the manual's
        # GitBook assets under the canonical name the page references. An
        # internal development build has no zip, so its heading is skipped.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p manual/.gitbook/assets
          VERSION=$(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+ — ' CHANGELOG.md \
            | grep -v 'internal development build' | head -n 1 | cut -d' ' -f2)
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern 'rush_GCU_*.zip' --dir manual/.gitbook/assets --clobber

      - name: Regenerate the manual firmware page
        run: python3 scripts/sync_manual.py apply manual

      - name: Open PR on the manual
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.MANUAL_SYNC_TOKEN }}
          path: manual
          commit-message: "docs(gcu): sync firmware releases from GCU-releases"
          branch: gcu-releases-sync
          title: "Sync GCU firmware releases"
          body: |
            Automated sync from `Rush-Auto-Works/GCU-releases`
            (${{ github.event_name }} on ${{ github.sha }}).

            Regenerates the `## Releases` section of the GCU firmware page from
            CHANGELOG.md and refreshes the download assets. Generated by
            `.github/workflows/sync-manual.yml`.
